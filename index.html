<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Adventure ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>


<body>


<div id="sky"></div>

<div id="stars"></div>

<div id="particles"></div>

<div id="petals"></div>



<!-- INTRO -->

<section id="intro">


<h1>A Little Adventure</h1>


<h2>made especially for</h2>


<h3>Nesrine ❤️</h3>


<p>from Adel ❤️</p>



<button id="startBtn">

🌸 Begin 🌸

</button>


</section>




<!-- GAME -->

<section id="game" class="hidden">


<div id="topBar">


<div id="progress">

<div class="step active">⭐</div>

<div class="line"></div>

<div class="step">💖</div>

<div class="line"></div>

<div class="step">💌</div>

</div>



<div id="music">

🎵

</div>


</div>




<div id="content">


<h1>

Welcome,

Nesrouneee ❤️

</h1>


<p>

I made this little adventure for you.

Take your time...

❤️

</p>



<button id="play">

Start Adventure ⭐

</button>


</div>


</section>





<!-- CHAPTERS -->

<section id="chapterContainer">

</section>





<!-- BACKGROUND MUSIC -->

<audio id="bgMusic" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>





<script src="script.js"></script>


</body>


</html>
